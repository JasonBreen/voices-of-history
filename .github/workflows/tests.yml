name: Offline regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r middleware/requirements-chatgpt.txt
      - run: python -m compileall -q middleware launcher.py unified_mod.py Launcher-Voices.py
      - run: python -m unittest discover -s tests -v
